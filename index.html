<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIRAI-Setu 2026 Kyushu A</title>
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" href="favicon.png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Tiro+Devanagari+Hindi&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a Japanese washi-paper scroll. Hero = ukiyo-e emblem (Fuji, sun, torii, waves) with falling sakura;
   team grid of sakura-crest buttons; an illustrated, animated map of the route stamped with eki-style hanko;
   #slug = one scholar's page. India appears as a quiet accent (सेतु, धन्यवाद). */
:root{
  --washi:#F5F0E6;      /* paper ground */
  --washi-2:#ECE4D4;    /* tile fill */
  --card:#FBF8F2;
  --sumi:#1D1B1F;       /* ink */
  --ai:#1F3A64;         /* indigo (aizome) */
  --shu:#C23B2E;        /* torii vermilion */
  --sakura:#C9637C;     /* deep sakura */
  --sakura-lt:#F3CDD5;
  --kin:#AE8838;        /* gold leaf */
  --matcha:#5A7A47;
  --muted:#6B645B;
  --line:#D9CFBF;
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-deva:"Tiro Devanagari Hindi","Noto Serif Devanagari","Mangal",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--washi);color:var(--sumi);font-family:var(--f-body);font-size:16px;line-height:1.65}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:3px solid var(--sakura);outline-offset:3px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.2;margin:0}
.wrap{max-width:1140px;margin:0 auto;padding:0 20px}

/* ---------- top: vermilion lintel like a torii beam ---------- */
.lintel{height:8px;background:var(--shu);box-shadow:0 4px 0 var(--sumi)}

/* ---------- bar ---------- */
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;letter-spacing:.02em}
.hanko{display:inline-grid;place-items:center;background:var(--shu);color:#fff;border-radius:5px;font-family:var(--f-display);line-height:1}
.brand .hanko{width:34px;height:34px;font-size:15px}
.bar nav{display:flex;gap:4px;flex-wrap:wrap}
.bar nav a{text-decoration:none;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:500}
.bar nav a:hover{background:var(--washi-2)}

/* ---------- hero ---------- */
.hero-wrap{position:relative;overflow:hidden}
#petals{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero{position:relative;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding:24px 0 52px}
.eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--shu);font-weight:700}
.title-pair{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:8px 0 6px}
.title-pair .jp{font-family:var(--f-display);font-size:clamp(64px,10vw,112px);font-weight:800;color:var(--sumi);line-height:.95;letter-spacing:.04em}
.title-pair .setu{display:flex;flex-direction:column;padding-bottom:10px;color:var(--kin)}
.title-pair .setu .r{font-family:var(--f-display);font-size:26px;letter-spacing:.06em}
.title-pair .setu .hi{font-family:var(--f-deva);font-size:22px;opacity:.85}
.hero h1{font-size:clamp(26px,3.4vw,36px);margin:6px 0 14px}
.hero p.lede{max-width:56ch;color:#3a3630;margin:0 0 22px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:999px;text-decoration:none;font-weight:700;font-size:15px;border:2px solid var(--sumi);font-family:inherit;cursor:pointer;background:none;color:var(--sumi)}
.btn.primary{background:var(--sumi);color:var(--washi)}
.btn.primary:hover{background:var(--shu);border-color:var(--shu)}
.btn.ghost:hover{background:var(--washi-2)}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:28px;padding-top:18px;border-top:1px solid var(--line)}
.stats b{display:block;font-family:var(--f-display);font-size:30px;color:var(--shu);line-height:1;font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:var(--muted)}
.emblem{width:100%;max-width:430px;justify-self:center}

/* ---------- seigaiha band ---------- */
.waves{--w1:#1F3A64;--w2:#2E4F84;height:56px;background-color:var(--w1);
  background-image:
  radial-gradient(circle at 100% 150%,var(--w1) 24%,var(--w2) 24%,var(--w2) 28%,var(--w1) 28%,var(--w1) 36%,var(--w2) 36%,var(--w2) 40%,transparent 40%,transparent),
  radial-gradient(circle at 0 150%,var(--w1) 24%,var(--w2) 24%,var(--w2) 28%,var(--w1) 28%,var(--w1) 36%,var(--w2) 36%,var(--w2) 40%,transparent 40%,transparent),
  radial-gradient(circle at 50% 100%,var(--w2) 10%,var(--w1) 10%,var(--w1) 23%,var(--w2) 23%,var(--w2) 30%,var(--w1) 30%,var(--w1) 43%,var(--w2) 43%,var(--w2) 50%,var(--w1) 50%,var(--w1) 63%,var(--w2) 63%,var(--w2) 71%,transparent 71%,transparent),
  radial-gradient(circle at 100% 50%,var(--w2) 5%,var(--w1) 5%,var(--w1) 15%,var(--w2) 15%,var(--w2) 20%,var(--w1) 20%,var(--w1) 29%,var(--w2) 29%,var(--w2) 34%,var(--w1) 34%,var(--w1) 44%,var(--w2) 44%,var(--w2) 49%,transparent 49%,transparent),
  radial-gradient(circle at 0 50%,var(--w2) 5%,var(--w1) 5%,var(--w1) 15%,var(--w2) 15%,var(--w2) 20%,var(--w1) 20%,var(--w1) 29%,var(--w2) 29%,var(--w2) 34%,var(--w1) 34%,var(--w1) 44%,var(--w2) 44%,var(--w2) 49%,transparent 49%,transparent);
  background-size:56px 28px}

/* ---------- sections ---------- */
section.block{padding:56px 0}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.sec-head h2{font-size:clamp(28px,4vw,40px);display:flex;align-items:center;gap:14px}
.sec-head h2 .hanko{width:44px;height:44px;font-size:20px;flex:none;writing-mode:vertical-rl}
.sec-head p{margin:0;color:var(--muted);max-width:46ch}

/* ---------- team grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
@media (min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:22px 14px 16px;
  background:var(--card);border:1px solid var(--line);border-radius:12px;text-decoration:none;transition:transform .2s,box-shadow .2s,border-color .2s}
.card:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(29,27,31,.12);border-color:var(--accent)}
.medal{position:relative;width:100px;height:100px;display:grid;place-items:center}
.medal svg{position:absolute;inset:0;width:100%;height:100%;transition:transform 1.4s ease}
.card:hover .medal svg{transform:rotate(36deg)}
.medal .face{position:relative;width:60px;height:60px;border-radius:50%;overflow:hidden;background:var(--accent);color:#fff;
  display:grid;place-items:center;font-family:var(--f-display);font-size:20px;border:3px solid var(--card)}
.medal .face img{width:100%;height:100%;object-fit:cover}
.card .nm{font-weight:700;line-height:1.3;white-space:nowrap}
.card .kana{font-family:var(--f-display);font-size:min(13px,7.6cqi);color:var(--muted);white-space:nowrap}
.card .go{margin-top:4px;font-size:13px;font-weight:700;color:var(--accent)}

/* ---------- map ---------- */
.map-layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:24px;align-items:start}
.map-frame{position:relative;background:#E6EBEF;border:2px solid var(--sumi);border-radius:4px;overflow:hidden;box-shadow:6px 6px 0 var(--washi-2)}
.map-frame svg{display:block;width:100%;height:auto}
.map-hud{position:absolute;left:12px;top:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.now{pointer-events:auto;background:rgba(251,248,242,.94);border:1px solid var(--line);border-left:5px solid var(--shu);border-radius:8px;padding:10px 14px;max-width:290px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.now .d{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--shu);text-transform:uppercase}
.now .pl{font-family:var(--f-display);font-size:22px;line-height:1.2}
.now .pl span{font-size:15px;color:var(--muted);margin-left:6px}
.now .w{font-size:13px;color:#4a443c}
.daybox{pointer-events:auto;text-align:center;background:var(--sumi);color:var(--washi);border-radius:8px;padding:8px 12px;min-width:84px}
.daybox b{display:block;font-family:var(--f-display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.daybox span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.progress{height:4px;background:var(--washi-2)}
.progress i{display:block;height:100%;width:100%;background:var(--shu);transition:width .2s linear}
.map-controls{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.map-controls small{color:var(--muted)}

.stops{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:s}
.stops .jump{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;
  padding:9px 12px;border-radius:8px;border:1px solid transparent;transition:background .2s,border-color .2s}
.stops .jump:hover{background:var(--card);border-color:var(--line)}
.stops .jump:focus-visible{outline:3px solid var(--sakura);outline-offset:2px}
.stops li.on .jump{background:var(--card);border-color:var(--shu)}
.stops .k{width:44px;height:44px;display:grid;place-items:center;border-radius:5px;background:var(--washi-2);color:var(--muted);font-family:var(--f-display);font-size:15px;writing-mode:vertical-rl;letter-spacing:-.05em;transition:background .3s,color .3s}
.stops li.done .k,.stops li.on .k{background:var(--shu);color:#fff}
.stops .t{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--shu);text-transform:uppercase}
.stops .p{font-weight:700;line-height:1.25}
.stops .w{font-size:13px;color:var(--muted);line-height:1.4}

/* map svg classes */
.land{fill:#FBF8F2;stroke:var(--sumi);stroke-width:1.6;stroke-linejoin:round}
.land-shadow{fill:#1F3A64;opacity:.14}
.route-base{fill:none;stroke:var(--sumi);stroke-width:2;stroke-dasharray:2 6;stroke-linecap:round;opacity:.45}
.route-live{fill:none;stroke:var(--shu);stroke-width:3.5;stroke-linecap:round}
.route-live.fly{stroke-dasharray:none}
.dot{fill:var(--shu);stroke:#fff;stroke-width:2}
.stamp{transform-box:fill-box;transform-origin:center;transition:transform .45s cubic-bezier(.2,1.6,.4,1),opacity .3s}
.stamp.off{opacity:0;transform:scale(1.8) rotate(-12deg)}
.stamp text{font-family:var(--f-display);font-weight:800;fill:#fff}
.city-lbl{font-family:var(--f-body);font-size:15px;font-weight:700;fill:var(--sumi);paint-order:stroke;stroke:#FBF8F2;stroke-width:4px}
.sea-lbl{font-family:var(--f-display);fill:#5f7896;font-size:20px;letter-spacing:.3em}

/* ---------- person page ---------- */
.p-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:18px 0 6px}
.p-hero{display:grid;grid-template-columns:auto 1fr;gap:32px;align-items:center;padding:20px 0 34px}
.p-hero .medal{width:200px;height:200px}
.p-hero .medal .face{width:122px;height:122px;font-size:40px;border-width:5px;border-color:var(--washi)}
.p-hero h1{font-size:clamp(34px,5vw,54px)}
.p-hero .kana{font-family:var(--f-display);font-size:20px;color:var(--shu);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{font-size:13px;padding:5px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.chip b{color:var(--shu);font-weight:700;margin-right:4px}
.quote{margin:18px 0 0;font-family:var(--f-display);font-size:20px;color:#3a3630;max-width:52ch;border-left:4px solid var(--sakura);padding-left:14px}
.ph{color:var(--muted);font-style:italic;text-decoration:underline dashed var(--line);text-underline-offset:4px}

.gallery{columns:3;column-gap:12px}
.gallery figure{margin:0 0 12px;break-inside:avoid;border-radius:10px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
.gallery img{display:block;width:100%;height:auto}
.gallery figcaption{padding:9px 12px;font-size:13px;font-weight:500;color:var(--sumi)}
.slot{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:14px;color:var(--muted);font-size:12px;
  background:radial-gradient(circle,rgba(201,99,124,.12) 0 22%,transparent 23%) 0 0/30px 30px,var(--washi-2)}
.slot svg{width:52px;height:52px;margin:0 auto 6px;opacity:.55}
.slot code{font-size:11px;background:var(--card);padding:2px 6px;border-radius:4px;border:1px solid var(--line)}

.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px 24px}
.panel h3{font-size:22px;margin-bottom:10px}
.panel h3 small{display:block;font-family:var(--f-display);font-size:13px;letter-spacing:.14em;color:var(--shu);margin-bottom:2px}
.panel ol{margin:0;padding-left:20px}
.panel ol li{margin:6px 0}
.word{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center}
.prose p{margin:0 0 .7em}.prose p:last-child{margin-bottom:0}
.word .k{font-family:var(--f-display);font-size:64px;color:var(--sumi);line-height:1;white-space:nowrap}
.word .r{font-weight:700}
.bridge{background:var(--ai);color:var(--washi);border-color:var(--ai)}
.bridge h3 small{color:var(--sakura-lt)}

.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:30px 0 10px}
.pager a{text-decoration:none;padding:12px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:14px;max-width:48%}
.pager a:hover{border-color:var(--shu)}
.pager a b{display:block;font-size:16px}

/* ---------- footer ---------- */
footer{background:var(--ai);color:var(--washi)}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:26px 20px 34px;font-size:14px}
footer .thanks{font-family:var(--f-display);font-size:24px}
footer .thanks .hi{font-family:var(--f-deva);font-size:18px;opacity:.75;margin-left:8px}

/* ---------- v3 additions ---------- */
.card{container-type:inline-size}
.card .medal{width:128px;height:128px}
.card .medal .face{width:88px;height:88px;font-size:26px}
.face img{width:100%;height:100%;object-fit:cover}
.pbox{position:relative}
.pbox:has(.slot){aspect-ratio:4/3}
.stops li{display:grid}
.lb-empty{color:#E9E1D2;text-align:center;padding:24px;max-width:46ch;line-height:1.6}
.lb-empty code{background:#2a262c;padding:2px 6px;border-radius:4px}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:10px 14px}
.thumbs button{all:unset;cursor:pointer;flex:none;width:78px;height:56px;border-radius:5px;overflow:hidden;border:2px solid transparent;opacity:.7}
.thumbs button img{width:100%;height:100%;object-fit:contain}
.thumbs button.on{border-color:var(--shu);opacity:1}
.thumbs button:focus-visible{outline:3px solid var(--sakura)}

.deck-stage{position:relative;aspect-ratio:16/9;background:#141216;border:2px solid var(--sumi);border-radius:6px;overflow:hidden;display:grid;place-items:center;box-shadow:6px 6px 0 var(--washi-2)}
.deck-stage:focus-visible{outline:3px solid var(--sakura);outline-offset:3px}
.deck-stage img{width:100%;height:100%;object-fit:contain}
.deck-stage:fullscreen{border:none;border-radius:0}
.deck-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.deck-bar .count{font-variant-numeric:tabular-nums;font-weight:700;min-width:96px;text-align:center}
.deck-bar .spacer{flex:1}
.icon-btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer}
.icon-btn:hover{border-color:var(--shu)}
.icon-btn:disabled{opacity:.45;cursor:default}
.dl-msg{font-size:13px;color:var(--shu);width:100%}
.disclaimer{font-size:12px;opacity:.75;width:100%}

@media (max-width:900px){
  .map-layout{grid-template-columns:1fr}
}
@media (max-width:820px){
  .hero{grid-template-columns:1fr}
  .emblem{max-width:300px;order:-1}
  .p-hero{grid-template-columns:1fr;justify-items:start}
  .p-hero .medal{width:160px;height:160px}
  .p-hero .medal .face{width:98px;height:98px}
  .two{grid-template-columns:1fr}
  .gallery{columns:2}
}
@media (max-width:520px){
  .now{max-width:200px;padding:8px 10px}
  .now .pl{font-size:18px}
  .now .w{display:none}
  .daybox b{font-size:22px}
}
@media (max-width:420px){
  .gallery{columns:1}
  .pager a{max-width:100%;flex:1}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="lintel" aria-hidden="true"></div>
<div class="wrap">
  <div class="bar">
    <a class="brand" href="#top"><span class="hanko">九</span>MIRAI-Setu 2026 · Kyushu A</a>
    <nav aria-label="Main">
      <a href="#team">Team</a>
      <a href="#journey">Journey map</a>
      <a href="#presentation">Presentation</a>
    </nav>
  </div>
</div>
<main id="app"></main>
<div class="waves" aria-hidden="true"></div>
<footer>
  <div class="wrap">
    <div class="thanks">ありがとうございました<span class="hi">धन्यवाद</span></div>
    <div>MIRAI-Setu 2026 · Kyushu A · Oct 7 – Nov 4, 2026</div>
    <div class="disclaimer">Created by MIRAI-Setu 2026 participants. Not an official AFS or Ministry website.</div>
  </div>
</footer>

<script>
/* =========================================================
   EDIT HERE: one entry per scholar = one button + one page.
   Photos load automatically from:
     images/<slug>/profile.jpg   (round portrait)
     images/<slug>/1.jpg … 6.jpg (gallery; shown whole, never cropped)
   <slug> is the name in lowercase with hyphens, e.g. images/aarsh-jain/
   Katakana names are a first guess. Check each with its owner.
   ========================================================= */
const PEOPLE = [

const MAP = {lon0:128.9, lat0:39.5, kx:72, ky:89.3, w:886, h:768};
const proj = (lon, lat) => [(lon - MAP.lon0) * MAP.kx, (MAP.lat0 - lat) * MAP.ky];

/* Closed Catmull-Rom spline through the points, as cubic Béziers. */
function smoothPath(flat){
  const P = [];
  for (let i = 0; i < flat.length; i += 2) P.push(proj(flat[i], flat[i+1]));
  const n = P.length, f = v => v.toFixed(1);
  let d = `M${f(P[0][0])},${f(P[0][1])}`;
  for (let i = 0; i < n; i++){
    const p0 = P[(i-1+n)%n], p1 = P[i], p2 = P[(i+1)%n], p3 = P[(i+2)%n];
    d += `C${f(p1[0]+(p2[0]-p0[0])/6)},${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)},${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])},${f(p2[1])}`;
  }
  return d + "Z";
}

function legPath(a, b, bend){
  const [x1,y1] = proj(a.lon, a.lat), [x2,y2] = proj(b.lon, b.lat);
  const mx = (x1+x2)/2, my = (y1+y2)/2, dx = x2-x1, dy = y2-y1;
  const cx = mx - dy*bend, cy = my + dx*bend;
  return `M${x1.toFixed(1)},${y1.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}`;
}

/* ---------- map animation ---------- */
function initMap(){
  const svg = document.querySelector(".map-frame svg");
  if (!svg) return;
  const lives = [...svg.querySelectorAll(".route-live")];
  const lens = lives.map(p => p.getTotalLength());
  lives.forEach((p,i) => { p.style.strokeDasharray = lens[i]; p.style.strokeDashoffset = 0; });
  const stamps = [...svg.querySelectorAll(".stamp")];
  const items = [...document.querySelectorAll("#stops li")];
  const tv = svg.querySelector("#traveller"), plane = svg.querySelector("#tv-plane"), dot = svg.querySelector("#tv-dot"), glow = svg.querySelector("#tv-glow");
  const dayEl = document.getElementById("day"), prog = document.getElementById("prog"), now = document.getElementById("now");
  const playBtn = document.getElementById("play");
  let run = 0;

  const place = (x,y,ang,fly) => {
    tv.setAttribute("transform", `translate(${x.toFixed(1)} ${y.toFixed(1)})`);
    plane.setAttribute("transform", `rotate(${ang})`);
    plane.style.opacity = fly ? 1 : 0; dot.style.opacity = fly ? 0 : 1; glow.style.opacity = fly ? 0 : .18;
  };
  const stampFor = i => stamps.find(s => STOPS[+s.dataset.stop].k === STOPS[i].k);
  const setDay = d => { dayEl.textContent = Math.round(d); prog.style.width = (d / TOTAL_DAYS * 100).toFixed(1) + "%"; };
  const showStop = i => {
    const s = STOPS[i];
    now.innerHTML = `<div class="d">${s.d} · Day ${s.day}</div><div class="pl">${s.pl}<span lang="ja">${s.k}</span></div><div class="w">${esc(s.w)}</div>`;
    items.forEach((li,k) => { li.classList.toggle("on", k === i); li.classList.toggle("done", k < i); });
    const st = stampFor(i); if (st) st.classList.remove("off");
    setDay(s.day);
  };
  const jumpTo = i => {
    run++;
    lives.forEach((p,k) => p.style.strokeDashoffset = k < i ? 0 : lens[k]);
    stamps.forEach(st => {
      const firstIdx = STOPS.findIndex(s => s.k === STOPS[+st.dataset.stop].k);
      st.classList.toggle("off", firstIdx > i);
    });
    const [x,y] = proj(STOPS[i].lon, STOPS[i].lat); place(x,y,0,false);
    showStop(i);
    playBtn.textContent = "▶ Play from the start";
  };
  const restAll = () => { /* complete state: whole route drawn, all stamps on */
    lives.forEach(p => p.style.strokeDashoffset = 0);
    stamps.forEach(st => st.classList.remove("off"));
    const [x,y] = proj(STOPS[0].lon, STOPS[0].lat); place(x,y,0,false);
    setDay(TOTAL_DAYS);
  };
  const tween = (ms, fn, id) => new Promise(res => {
    const t0 = performance.now();
    const step = t => { if (id !== run) return res(false);
      const k = Math.min(1, (t - t0) / ms); fn(k < .5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2) / 2, k);
      k < 1 ? requestAnimationFrame(step) : res(true); };
    requestAnimationFrame(step);
  });
  const wait = (ms, id) => new Promise(res => setTimeout(() => res(id === run), ms));

  async function play(){
    const id = ++run;
    playBtn.textContent = "↺ Replay";
    lives.forEach((p,k) => p.style.strokeDashoffset = lens[k]);
    stamps.forEach(st => st.classList.add("off"));
    const [x0,y0] = proj(STOPS[0].lon, STOPS[0].lat); place(x0,y0,0,false);
    showStop(0);
    if (!await wait(1200, id)) return;
    for (let i = 0; i < LEGS.length; i++){
      const p = lives[i], L = lens[i], fly = LEGS[i].fly, d0 = STOPS[i].day, d1 = STOPS[i+1].day;
      const ok = await tween(Math.max(900, L * (fly ? 3.2 : 6)), e => {
        p.style.strokeDashoffset = L * (1 - e);
        const a = p.getPointAtLength(L * e), b = p.getPointAtLength(Math.min(L, L * e + 1));
        place(a.x, a.y, Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI, fly);
        setDay(d0 + (d1 - d0) * e);
      }, id);
      if (!ok) return;
      const end = proj(STOPS[i+1].lon, STOPS[i+1].lat); place(end[0], end[1], 0, false);
      showStop(i+1);
      if (!await wait(1300, id)) return;
    }
    await wait(600, id);
    if (id === run) { setDay(TOTAL_DAYS); items.forEach(li => { li.classList.remove("on"); li.classList.add("done"); }); }
  }

  restAll();
  playBtn.addEventListener("click", play);
  items.forEach((li,i) => li.querySelector(".jump").addEventListener("click", () => jumpTo(i)));

  if (!reduceMotion && "IntersectionObserver" in window){
    const io = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) { io.disconnect(); play(); } }, {threshold:.45});
    io.observe(svg);
  }
}

/* ---------- falling sakura petals in the hero ---------- */
function initPetals(){
  const c = document.getElementById("petals");
  if (!c || reduceMotion) return;
  const ctx = c.getContext("2d");
  let W, H, petals;
  const size = () => { W = c.width = c.offsetWidth * devicePixelRatio; H = c.height = c.offsetHeight * devicePixelRatio; };
  size(); addEventListener("resize", size);
  petals = Array.from({length:22}, () => ({x:Math.random()*W, y:Math.random()*H, r:(5+Math.random()*5)*devicePixelRatio,
    vx:(.3+Math.random()*.6)*devicePixelRatio, vy:(.5+Math.random()*.8)*devicePixelRatio, a:Math.random()*6, va:.01+Math.random()*.03}));
  const frame = () => {
    if (!document.body.contains(c)) return;
    ctx.clearRect(0,0,W,H);
    for (const p of petals){
      p.x += p.vx + Math.sin(p.a)*.4; p.y += p.vy; p.a += p.va;
      if (p.y > H + 20){ p.y = -20; p.x = Math.random()*W; }
      if (p.x > W + 20) p.x = -20;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.scale(1, Math.abs(Math.cos(p.a))*.6 + .4);
      ctx.beginPath(); ctx.moveTo(0,-p.r); ctx.bezierCurveTo(p.r,-p.r, p.r*.8,p.r*.6, 0,p.r); ctx.bezierCurveTo(-p.r*.8,p.r*.6,-p.r,-p.r,0,-p.r);
      ctx.fillStyle = "rgba(233,160,178,.55)"; ctx.fill(); ctx.restore();
    }
    requestAnimationFrame(frame);
  };
  frame();
}

/* ---------- photo loading: try each extension until one exists ---------- */
const EXTS = ["jpg","jpeg","png","webp","JPG","JPEG","PNG"];
const _probe = new Map();
function tryLoad(bases, exts = EXTS){
  const key = bases.join("|") + "#" + exts.join(",");
  if (_probe.has(key)) return _probe.get(key);
  const urls = bases.flatMap(b => exts.map(e => `${b}.${e}`));
  const pr = new Promise(res => {
    let k = 0; const img = new Image();
    img.onload = () => res(urls[k]);
    img.onerror = () => { k++; k < urls.length ? img.src = urls[k] : res(null); };
    img.src = urls[0];
  });
  _probe.set(key, pr); return pr;
}
/* Swap a placeholder element's content for its photo, if the photo exists. */
function hydrate(root = document){
  root.querySelectorAll("[data-photo]").forEach(el => {
    tryLoad([el.dataset.photo]).then(url => {
      if (url) el.innerHTML = `<img src="${url}" alt="${el.dataset.alt || ""}">`;
    });
  });
}
const _albums = new Map();
function listSlides(dir, max = 80){
  if (_albums.has(dir)) return _albums.get(dir);
  const pr = (async () => {
    const out = [];
    for (let i = 1; i <= max; i++){
      const u = await tryLoad([`${dir}/Slide${i}`, `${dir}/slide${i}`, `${dir}/${i}`], ["PNG","png","jpg","JPG","jpeg"]);
      if (!u) break; out.push(u);
    }
    return out;
  })();
  _albums.set(dir, pr); return pr;
}

async function initDeck(){
  const stage = document.getElementById("deck-stage");

    stage.innerHTML = `<img src="${slides[i]}" alt="Slide ${i+1} of ${slides.length}">`;
    cnt.textContent = `Slide ${i+1} / ${slides.length}`;
    th.querySelectorAll("button").forEach((b,n) => b.classList.toggle("on", n === i));

  };
  if (!slides.length){
    stage.innerHTML = `<div class="lb-empty">The slides will appear here.<br>In PowerPoint: <b>File → Export → Change File Type → PNG → All Slides</b>, then put the images in <code>website/${PRESENTATION.slidesDir}/</code>.</div>`;
    cnt.textContent = "No slides yet";
    [prev,next,full].forEach(b => b.disabled = true);
  } else {
    th.innerHTML = slides.map((u,n) => `<button type="button" aria-label="Slide ${n+1}"><img src="${u}" alt=""></button>`).join("");
    th.querySelectorAll("button").forEach((b,n) => b.onclick = () => show(n));
    prev.onclick = () => show(i-1); next.onclick = () => show(i+1);
    stage.addEventListener("keydown", e => {
      if (e.key === "ArrowLeft") { e.preventDefault(); show(i-1); }
      if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); show(i+1); }
    });
    stage.addEventListener("click", e => { const r = stage.getBoundingClientRect(); show(e.clientX - r.left < r.width/3 ? i-1 : i+1); });
    full.onclick = async () => {
      try { document.fullscreenElement ? await document.exitFullscreen() : await stage.requestFullscreen(); stage.focus(); }
      catch(e){ document.getElementById("dl-msg").textContent = "Full screen isn't available in this view. Try opening the page in its own browser tab."; }
    };
    show(0);
  }
  /* Inside claude.ai the page must hand files over through the downloads capability;
     opened from the folder, the plain link downloads the file. */
  document.querySelectorAll("a.dl").forEach(a => a.addEventListener("click", async e => {
    if (!downloadsApi) return;
    e.preventDefault();
    const msg = document.getElementById("dl-msg"); msg.textContent = "";
    const url = a.getAttribute("href"), name = url.split("/").pop();
    try {
      const r = await fetch(url);
      if (!r.ok) throw {message:`Couldn't find ${url}. Add the file to the website's presentation folder.`};
      await downloadsApi.save({filename:name, data: await r.blob()});
    } catch(err){
      if (err && err.code === "declined") return;
      msg.textContent = (err && err.message) || "The download didn't start. Try again.";
    }
  }));
}

      <div class="panel">
        <h3><small lang="ja">思い出</small>My favourite moment</h3>
        <div class="prose">${p.story ? paras(p.story) : `<p>${ph("Two or three lines about the moment you'll remember first. Where were you, who was there, what happened?")}</p>`}</div>
      </div>
      <div class="panel">
        <h3><small lang="ja">持ち帰るもの</small>What I'm taking home</h3>
        <ol>${take.map(t => `<li>${p.takeaways ? esc(t) : ph(t)}</li>`).join("")}</ol>
      </div>
      <div class="panel">
        <h3><small lang="ja">好きな言葉</small>My favourite Japanese word</h3>
        <div class="word">
          <div class="k" lang="ja" style="font-size:${kSize}px">${esc(w.k)}</div>
          <div><div class="r">${esc(w.r)}</div><div style="color:var(--muted)">${esc(w.m)}</div></div>
        </div>
      </div>
      <div class="panel bridge">
        <h3><small lang="ja">架け橋</small>My bridge idea</h3>
        <div class="prose">${p.bridgeTitle ? `<p><b>${esc(p.bridgeTitle)}</b></p>` : ""}${p.bridge ? paras(p.bridge) : `<p><span style="opacity:.8;font-style:italic">One idea to bring India and Japan closer, whether that's language, internships, a student club or a startup.</span></p>`}</div>
      </div>
    </div>

    <nav class="pager" aria-label="Other scholars">
      <a href="#${prev.slug}">← Previous<b>${esc(prev.name)}</b></a>
      <a href="#${next.slug}" style="text-align:right">Next →<b>${esc(next.name)}</b></a>
    </nav>
  </div>`;
}

/* ---------- router: #<slug> opens a person, anything else shows home ---------- */
function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  const app = document.getElementById("app");
  const person = PEOPLE.find(p => p.slug === h);
  if (person){
    app.innerHTML = personView(person); hydrate(app);
    document.title = person.name + " · MIRAI-Setu 2026";
    window.scrollTo(0,0);
  } else {
    const wasHome = app.dataset.view === "home";
    if (!wasHome){ app.innerHTML = homeView(); hydrate(app); initMap(); initPetals(); initDeck(); }
    document.title = "MIRAI-Setu 2026 Kyushu A";
    const target = h && document.getElementById(h);
    if (target) target.scrollIntoView(); else if (!wasHome) window.scrollTo(0,0);
  }
  app.dataset.view = person ? "person" : "home";
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
